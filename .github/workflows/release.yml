# Builds the native SDK (static library, headers, CMake package, demo) on every
# platform, checks the demo and a find_package() consumer against the installed
# SDK, and - for a v* tag - publishes the archives with SHA256SUMS.txt, which
# scripts/update-sdk.sh and update-sdk.ps1 use to verify downloads.
# "Run workflow" builds without publishing.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64, ext: tar.gz }
          - { os: ubuntu-22.04-arm, name: linux-arm64, ext: tar.gz }
          - { os: macos-latest, name: macos-arm64, ext: tar.gz }
          - { os: macos-15-intel, name: macos-x86_64, ext: tar.gz }
          - { os: windows-latest, name: windows-x64, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          V=$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\).*/\1/p' native/CMakeLists.txt)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$V" ]]; then
            echo "tag $GITHUB_REF_NAME does not match CMake VERSION $V"; exit 1; fi
      - name: Build and install
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          SDK="anti-reverse-shield-sdk-$VERSION-${{ matrix.name }}"
          cmake --install build --config Release --prefix "stage/$SDK"
          cp LICENSE README.md "stage/$SDK/"
          cp native/README.md "stage/$SDK/NATIVE.md"
          echo "$VERSION" > "stage/$SDK/VERSION"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
      - name: Check the demo and a find_package() consumer
        run: |
          "stage/$SDK/bin/ars_demo"
          cmake -S native/examples/consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/stage/$SDK" -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer --config Release
          if [ -x consumer/ars_consumer ]; then consumer/ars_consumer; else consumer/Release/ars_consumer.exe; fi
      - name: Package
        run: |
          mkdir -p out
          if [ "${{ matrix.ext }}" = zip ]; then
            (cd stage && 7z a -tzip "../out/$SDK.zip" "$SDK" >/dev/null)
          else
            tar -C stage -czf "out/$SDK.tar.gz" "$SDK"
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and notes
        run: |
          python3 - <<'PY' > notes.md
          import hashlib, os, pathlib
          tag = os.environ.get("GITHUB_REF_NAME", "")
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag[1:] if tag.startswith("v") else tag
          art = pathlib.Path("artifacts")
          files = sorted(p for p in art.iterdir() if p.name != "SHA256SUMS.txt")
          sums = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          (art / "SHA256SUMS.txt").write_text("".join(f"{sums[n]}  {n}\n" for n in sums))
          labels = {"linux-x86_64": "Linux x86-64 (glibc 2.35+)", "linux-arm64": "Linux ARM64 (glibc 2.35+)",
                    "macos-arm64": "macOS 11+ Apple silicon", "macos-x86_64": "macOS 11+ Intel",
                    "windows-x64": "Windows x64 (MSVC)"}
          notes = pathlib.Path(f"docs/release-notes/{version}.md")
          if notes.exists():
              print(notes.read_text().rstrip() + "\n")
          print("## Downloads - native SDK\n")
          print("Each archive holds `include/` (shield.h, obfstr.hpp), `lib/` (static library and the CMake package "
                "`ars_shield` -> target `ars::shield`), `bin/ars_demo`, `VERSION` and the docs.\n")
          print("| Platform | File | Size | SHA-256 |\n|---|---|---:|---|")
          for p in files:
              plat = next((v for k, v in labels.items() if k in p.name), "-")
              url = f"https://github.com/{repo}/releases/download/{tag}/{p.name}"
              print(f"| {plat} | [`{p.name}`]({url}) | {p.stat().st_size / 1024:.0f} KB | `{sums[p.name]}` |")
          print("\nThe Android, Electron, .NET and server modules are source files: use the *Source code* archive "
                "below or the repository.\n")
          print("### Keeping a vendored copy up to date\n")
          print("`scripts/update-sdk.sh` (Linux, macOS) and `scripts/update-sdk.ps1` (Windows) download the archive "
                "for the current platform, verify it against `SHA256SUMS.txt` and replace "
                "`third_party/anti-reverse-shield` (`--check` / `-Check` exits 10 when a newer release exists). "
                "docs/UPDATING.md has a scheduled GitHub Actions workflow that runs the check weekly and opens a "
                "pull request.")
          PY
          cat notes.md; cat artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: |
            artifacts/SHA256SUMS.txt
            notes.md
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "anti-reverse-shield ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
          fi
