name: native-build
on:
  push: { paths: ['native/**', '.github/workflows/native-build.yml'] }
  pull_request: { paths: ['native/**'] }
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B native/build -S native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --config Release
